name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup KV Namespace
        id: kv
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_TITLE="card-tab-CARD_ORDER"
          echo "Checking for existing KV namespace..."
          EXISTING=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          KV_ID=$(echo "$EXISTING" | jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id // empty')
          if [ -z "$KV_ID" ]; then
            echo "Creating new KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"card-tab-CARD_ORDER"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id // empty')
            if [ -z "$KV_ID" ]; then
              echo "Failed to create KV namespace"
              echo "$CREATE_RESULT" | jq .
              exit 1
            fi
            echo "Created KV namespace: $KV_ID"
          else
            echo "Found existing KV namespace: $KV_ID"
          fi
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Prepare Variables and Deploy Config
        id: vars
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INPUT_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          INPUT_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          WORKER_NAME="card-tab"
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s/PLACEHOLDER/${KV_ID}/g" wrangler.toml

          if [ -n "$INPUT_ADMIN_USERNAME" ]; then
            USERNAME_VAL="$INPUT_ADMIN_USERNAME"
          else
            USERNAME_VAL="admin"
          fi

          if [ -n "$INPUT_ADMIN_PASSWORD" ]; then
            PASSWORD_VAL="$INPUT_ADMIN_PASSWORD"
          else
            PASSWORD_VAL=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 8)
            if [ ${#PASSWORD_VAL} -lt 8 ]; then
              PASSWORD_VAL="admin123"
            fi
          fi

          if [ -n "$INPUT_JWT_SECRET" ]; then
            JWT_VAL="$INPUT_JWT_SECRET"
          else
            JWT_VAL=$(openssl rand -base64 48 | tr -dc 'a-zA-Z0-9' | head -c 64)
          fi

          echo "" >> wrangler.toml
          echo "ADMIN_USERNAME = \"${USERNAME_VAL}\"" >> wrangler.toml
          sed -i "s/DEFAULT_USER = .*/DEFAULT_USER = \"${USERNAME_VAL}\"/g" wrangler.toml
          echo "ADMIN_PASSWORD = \"${PASSWORD_VAL}\"" >> wrangler.toml
          echo "JWT_SECRET = \"${JWT_VAL}\"" >> wrangler.toml

          echo "username=${USERNAME_VAL}" >> $GITHUB_OUTPUT
          echo "password=${PASSWORD_VAL}" >> $GITHUB_OUTPUT
          echo "jwt_secret=${JWT_VAL}" >> $GITHUB_OUTPUT

          echo "Updated wrangler.toml:"
          cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo ""
          echo "=========================================="
          echo " 🎉 Card Tab 部署成功！ Deploy Success!"
          echo "=========================================="
          echo " Worker 名称:     card-tab"
          echo " KV Namespace:    ${{ steps.kv.outputs.kv_id }}"
          echo " ------------------------------------------"
          echo " 🔑 超级管理员账号: ${{ steps.vars.outputs.username }}"
          echo " 🔑 超级管理员密码: ${{ steps.vars.outputs.password }}"
          echo "=========================================="
          echo "提示：密码已自动写入 Cloudflare 控制台环境变量中（ADMIN_PASSWORD）。"
          echo "如果您想固定使用自己的密码，可以在 GitHub Secrets 里添加 ADMIN_PASSWORD 设置，或在 Cloudflare 控制台修改该变量。"
