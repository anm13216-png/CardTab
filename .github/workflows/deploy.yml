name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup KV Namespace
        id: kv
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_TITLE="card-tab-CARD_ORDER"
          echo "Checking for existing KV namespace..."
          EXISTING=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          KV_ID=$(echo "$EXISTING" | jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id // empty')
          if [ -z "$KV_ID" ]; then
            echo "Creating new KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"card-tab-CARD_ORDER"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id // empty')
            if [ -z "$KV_ID" ]; then
              echo "Failed to create KV namespace"
              echo "$CREATE_RESULT" | jq .
              exit 1
            fi
            echo "Created KV namespace: $KV_ID"
          else
            echo "Found existing KV namespace: $KV_ID"
          fi
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Prepare Variables and Deploy Config
        id: vars
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INPUT_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          INPUT_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          WORKER_NAME="card-tab"
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s/PLACEHOLDER/${KV_ID}/g" wrangler.toml
                    if [ -n "$INPUT_ADMIN_USERNAME" ]; then
            echo "ADMIN_USERNAME = \"$INPUT_ADMIN_USERNAME\"" >> wrangler.toml
            echo "Using ADMIN_USERNAME from GitHub Secrets"
          else
            echo "ADMIN_USERNAME GitHub Secret not set, preserving Cloudflare Dashboard setting."
          fi

          if [ -n "$INPUT_ADMIN_PASSWORD" ]; then
            echo "ADMIN_PASSWORD = \"$INPUT_ADMIN_PASSWORD\"" >> wrangler.toml
            echo "Using ADMIN_PASSWORD from GitHub Secrets"
          else
            echo "ADMIN_PASSWORD GitHub Secret not set, preserving Cloudflare Dashboard setting."
          fi

          if [ -n "$INPUT_JWT_SECRET" ]; then
            echo "JWT_SECRET = \"$INPUT_JWT_SECRET\"" >> wrangler.toml
            echo "Using JWT_SECRET from GitHub Secrets"
          else
            echo "JWT_SECRET GitHub Secret not set, preserving Cloudflare Dashboard setting."
          fi

          echo "Updated wrangler.toml:"
          cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo ""
          echo "=========================================="
          echo "  Card Tab Deploy Success!"
          echo "=========================================="
          echo "  Worker:          card-tab"
          echo "  KV ID:           ${{ steps.kv.outputs.kv_id }}"
          echo "  Note:            ADMIN_USERNAME & ADMIN_PASSWORD read directly from Cloudflare Dashboard / Secrets"
          echo "=========================================="
